<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="favNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- High-contrast circular tab coin with emerald perimeter ring -->
  <circle cx="32" cy="32" r="30" fill="url(#favNavy)"/>
  <circle cx="32" cy="32" r="28.5" fill="none" stroke="#10b981" stroke-width="2.5" opacity="0.9"/>

  <!-- High-visibility simplified Graduation Cap for 16px/32px browser tab clarity -->
  <!-- Top diamond -->
  <polygon points="32,15 53,25 32,35 11,25" fill="url(#favEmerald)"/>

  <!-- Cap lower skullcap ribbon band -->
  <path d="M19,29.5 L19,38 C19,43.5 24.5,47.5 32,47.5 C39.5,47.5 45,43.5 45,38 L45,29.5 L32,35.5 Z" fill="#ffffff"/>

  <!-- Tassel Ribbon & Accent Bead (Golden Amber) -->
  <path d="M48,27.5 L53,35 L53,42" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <circle cx="53" cy="42" r="2.2" fill="#f59e0b"/>

  <!-- Center Scholar Sparkle Dot in Navy -->
  <circle cx="32" cy="25" r="2.5" fill="#090d16"/>
  <circle cx="32" cy="39" r="2" fill="#10b981"/>
</svg>
